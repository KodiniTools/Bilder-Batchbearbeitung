name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: pkg
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build Electron app for Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ''

      # Write a version.json next to the release files so the website can
      # display the current version without parsing filenames
      - name: Create version.json
        shell: bash
        run: |
          echo '{
            "version": "${{ steps.pkg.outputs.version }}",
            "installer": "Bilderserie Bearbeiten Setup ${{ steps.pkg.outputs.version }}.exe",
            "portable": "Bilderserie Bearbeiten-${{ steps.pkg.outputs.version }}-win.zip",
            "builtAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          }' > release/version.json

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bilderserie-Bearbeiten-Windows-Setup-v${{ steps.pkg.outputs.version }}
          path: release/*.exe
          retention-days: 90

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bilderserie-Bearbeiten-Windows-Portable-v${{ steps.pkg.outputs.version }}
          path: release/*.zip
          retention-days: 90

      # Deploy .exe, .zip and version.json to the web server via SCP.
      # Required GitHub Secrets:
      #   SERVER_HOST     – hostname or IP of kodinitools.com
      #   SERVER_USER     – SSH username (e.g. deploy)
      #   SERVER_SSH_KEY  – private SSH key (paste the full PEM content)
      #   SERVER_PORT     – SSH port (default 22; set secret to 22 if unchanged)
      - name: Deploy release files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'release/*.exe,release/*.zip,release/version.json'
          target: '/var/www/kodinitools.com/bilderseriebearbeiten/release/'
          strip_components: 1
          overwrite: true

      # Create a GitHub Release only when pushing a version tag (v*)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bilderserie Bearbeiten v${{ steps.pkg.outputs.version }}
          body: |
            ## Bilderserie Bearbeiten v${{ steps.pkg.outputs.version }}

            ### Download
            - **Installer (.exe)** – empfohlen für die meisten Nutzer
            - **Portable (.zip)** – kein Setup erforderlich, direkt ausführbar

            ### Direkte Download-Links
            - [Installer herunterladen](https://kodinitools.com/bilderseriebearbeiten/release/Bilderserie%20Bearbeiten%20Setup%20${{ steps.pkg.outputs.version }}.exe)
            - [Portable ZIP herunterladen](https://kodinitools.com/bilderseriebearbeiten/release/Bilderserie%20Bearbeiten-${{ steps.pkg.outputs.version }}-win.zip)

            ---
            *Datenschutz: Alle Bildoperationen laufen lokal im Gerät – keine Uploads auf Server.*
          files: |
            release/*.exe
            release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
